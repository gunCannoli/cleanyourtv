name: Build launcher APK

# Fork-only workflow: builds launcher/app-release.apk signed with a fixed key (secret DEBUG_KEYSTORE_B64,
# a PKCS12 keystore with alias androiddebugkey / password android), so every build installs over the
# previous one with `pm install -r`. Download the artifact into launcher/app/build/outputs/apk/release/
# and run `SKIP_BUILD=1 TV_HOST=<tv> launcher/build-and-install.sh`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::secret DEBUG_KEYSTORE_B64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvhome.keystore"
      - name: Build release APK
        working-directory: launcher
        # The injected signing properties override signingConfigs.debug, so the APK is signed with the
        # fixed key whatever debug keystore AGP would otherwise find or generate.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/tvhome.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Signer
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            launcher/app/build/outputs/apk/release/app-release.apk | head -3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
